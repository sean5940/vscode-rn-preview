name: Build and release the extension

# When the rn-preview tool changes, its sources are bundled, the extension is rebuilt, and the
# result is published to a release, and to Open VSX when its token is set. The notify-extension
# workflow in the tool repository triggers this through repository_dispatch.
#
# The VS Code Marketplace is not published to from here. It only accepts Azure DevOps tokens
# scoped to all organizations, and those are retired on 2026-12-01. The .vsix attached to the
# release is uploaded on the Marketplace management page instead (CONTRIBUTING.md).
#
# It does not run on its own pushes. The version bump is committed to main, so with push as a
# trigger that commit would call this workflow again and loop forever.

on:
    workflow_dispatch:
        inputs:
            bump:
                description: Which part to bump
                type: choice
                options: [patch, minor]
                default: patch
    repository_dispatch:
        types: [tool-updated]

permissions:
    contents: write

concurrency:
    group: release-extension
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        # The store token is read here so the publish step can be skipped when it is not set. A
        # step's `if` cannot read secrets directly.
        env:
            OVSX_PAT: ${{ secrets.OVSX_PAT }}
        steps:
            # A layout that keeps the tool as a sibling. syncTool's default path (`../rn-preview`) fits as is.
            - name: Check out the extension repository
              uses: actions/checkout@v4
              with:
                  path: vscode-rn-preview

            # A separate token is needed while the repository is private. Once public the default token works.
            - name: Check out the preview tool
              uses: actions/checkout@v4
              with:
                  repository: sean5940/rn-preview
                  ref: main
                  path: rn-preview
                  token: ${{ secrets.TOOL_REPO_TOKEN || github.token }}

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: vscode-rn-preview/package-lock.json

            - name: Install dependencies
              working-directory: vscode-rn-preview
              run: npm ci

            - name: Verify
              working-directory: vscode-rn-preview
              run: npm run verify

            - name: Bundle the tool sources
              working-directory: vscode-rn-preview
              run: node scripts/syncTool.mjs ../rn-preview

            # The version has to be bumped for it to reach people who already installed. toolBootstrap
            # compares a stamp against the extension version, and an unchanged version keeps using the
            # old copy of the tool.
            - name: Bump the version
              working-directory: vscode-rn-preview
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  # An earlier run may have already bumped it. If the checkout predates that push,
                  # rebuilding the same version and pushing is rejected. Fetch the latest right
                  # before bumping.
                  git pull --rebase origin main
                  npm version "${{ inputs.bump || 'patch' }}" --no-git-tag-version
                  echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

            - name: Build the installable
              working-directory: vscode-rn-preview
              run: npx vsce package --no-dependencies

            - name: Commit the bumped version
              working-directory: vscode-rn-preview
              run: |
                  git commit -am "chore: bump the extension to ${VERSION} for the tool change"
                  git push

            - name: Publish to a release
              working-directory: vscode-rn-preview
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "v${VERSION}" ./*.vsix \
                    --title "v${VERSION}" \
                    --notes "Extension rebuilt with the latest rn-preview tool changes. Download the .vsix and select it in your editor through \`Extensions: Install from VSIX...\`."

            # Cursor and other VS Code forks install from Open VSX. The file published is the one
            # attached to the release, so the two never differ.
            - name: Publish to Open VSX
              if: env.OVSX_PAT != ''
              working-directory: vscode-rn-preview
              run: npx ovsx publish "vscode-rn-preview-${VERSION}.vsix"
